<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f13"/>
      <stop offset="100%" stop-color="#1a1a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2a"/>
      <stop offset="100%" stop-color="#16161f"/>
    </linearGradient>
    <radialGradient id="glow" cx="15%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="520" fill="url(#bg)"/>
  <rect width="1280" height="520" fill="url(#glow)"/>

  <!-- Decorative circles -->
  <circle cx="180" cy="120" r="80" fill="none" stroke="#dc2626" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="180" cy="120" r="55" fill="none" stroke="#dc2626" stroke-opacity="0.06" stroke-width="1.5"/>
  <circle cx="180" cy="120" r="30" fill="none" stroke="#dc2626" stroke-opacity="0.04" stroke-width="1.5"/>
  <circle cx="180" cy="120" r="5" fill="#dc2626" opacity="0.6"/>

  <!-- Bottom accent bar -->
  <rect y="512" width="1280" height="8" fill="url(#accent)"/>

  <!-- LaraArabDev branding -->
  <text x="60" y="62" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#dc2626">LaraArabDev</text>
  <line x1="188" y1="42" x2="188" y2="72" stroke="#dc2626" stroke-width="2" opacity="0.6"/>
  <text x="198" y="55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="2">LARAVEL · AUDIT TRAIL &amp; ROLLBACK</text>

  <!-- Title -->
  <text x="60" y="160" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="62" font-weight="800" fill="#ffffff">
    <tspan>Recordkeeper</tspan>
    <tspan fill="#dc2626">.</tspan>
  </text>

  <!-- Accent line under title -->
  <rect x="60" y="175" width="80" height="4" rx="2" fill="url(#accent)"/>

  <!-- English tagline -->
  <text x="60" y="210" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#94a3b8">Headless audit trail, rollback &amp; data protection for Laravel</text>

  <!-- Feature pills -->
  <g transform="translate(60, 250)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="155" height="36" rx="18" fill="none" stroke="#dc2626" stroke-opacity="0.4" stroke-width="1"/>
    <text x="77" y="24" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#f87171" text-anchor="middle">Audit everything</text>

    <!-- Pill 2 -->
    <rect x="170" y="0" width="175" height="36" rx="18" fill="none" stroke="#dc2626" stroke-opacity="0.4" stroke-width="1"/>
    <text x="257" y="24" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#f87171" text-anchor="middle">One-click rollback</text>

    <!-- Pill 3 -->
    <rect x="360" y="0" width="160" height="36" rx="18" fill="none" stroke="#dc2626" stroke-opacity="0.4" stroke-width="1"/>
    <text x="440" y="24" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#f87171" text-anchor="middle">Redact &amp; encrypt</text>

    <!-- Pill 4 -->
    <rect x="535" y="0" width="160" height="36" rx="18" fill="none" stroke="#dc2626" stroke-opacity="0.4" stroke-width="1"/>
    <text x="615" y="24" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#f87171" text-anchor="middle">PHP 8 Attributes</text>

    <!-- Pill 5 -->
    <rect x="710" y="0" width="175" height="36" rx="18" fill="none" stroke="#dc2626" stroke-opacity="0.4" stroke-width="1"/>
    <text x="797" y="24" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#f87171" text-anchor="middle">8 Artisan commands</text>
  </g>

  <!-- Code card -->
  <g filter="url(#shadow)">
    <rect x="700" y="310" width="520" height="150" rx="12" fill="url(#cardBg)" stroke="#2a2a3a" stroke-width="1"/>

    <!-- Card header dots -->
    <circle cx="724" cy="334" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="740" cy="334" r="5" fill="#eab308" opacity="0.8"/>
    <circle cx="756" cy="334" r="5" fill="#22c55e" opacity="0.8"/>

    <!-- Code content -->
    <text x="720" y="370" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="12.5" fill="#64748b">// Payment model with audit attributes</text>
    <text x="720" y="392" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="12.5">
      <tspan fill="#c084fc">#[Auditable</tspan><tspan fill="#94a3b8">(</tspan><tspan fill="#fbbf24">events</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#86efac">'created'</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">'updated'</tspan><tspan fill="#94a3b8">])]</tspan>
    </text>
    <text x="720" y="414" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="12.5">
      <tspan fill="#c084fc">#[Redact</tspan><tspan fill="#94a3b8">(</tspan><tspan fill="#86efac">'cvv'</tspan><tspan fill="#94a3b8">)]</tspan><tspan fill="#64748b">  // replaced with ***</tspan>
    </text>
    <text x="720" y="436" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="12.5">
      <tspan fill="#c084fc">#[Encrypt</tspan><tspan fill="#94a3b8">(</tspan><tspan fill="#86efac">'national_id'</tspan><tspan fill="#94a3b8">)]</tspan><tspan fill="#64748b">  // AES encrypted</tspan>
    </text>
  </g>

  <!-- Terminal chip -->
  <g filter="url(#shadow)">
    <rect x="60" y="340" width="580" height="46" rx="10" fill="#111119" stroke="#2a2a3a" stroke-width="1"/>
    <text x="80" y="369" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="14">
      <tspan fill="#dc2626">$</tspan>
      <tspan fill="#e2e8f0"> composer require laraarabdev/recordkeeper</tspan>
    </text>
  </g>

  <!-- Bottom info -->
  <text x="60" y="490" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="13" fill="#64748b">MIT Licensed · PHP 8.2–8.4 · Laravel 11 / 12</text>

  <!-- Community tagline -->
  <text x="1220" y="490" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748b" text-anchor="end">We build, develop, empower, and contribute — Arab open-source community</text>
</svg>
